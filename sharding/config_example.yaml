# 分库分表配置示例

mysql:
  host: 127.0.0.1
  port: 3306
  username: root
  password: your_password
  database: myapp

# true：读 sharding.databases；false：读 mysql
enable_sharding: true

sharding:
  databases:
    - host: 10.0.0.1
      port: 3306
      username: root
      password: your_password
      database: myapp_0
      charset: utf8mb4
    - host: 10.0.0.2
      port: 3306
      username: root
      password: your_password
      database: myapp_1
      charset: utf8mb4

  primary_key_generator: snowflake
  snowflake:
    worker_id: 1
    datacenter_id: 1
    max_tolerate_time_difference_ms: 2000

  table_configs:
    users:
      algorithm_type: long
      sharding_key: user_id
      table_count: 4
    orders:
      algorithm_type: long
      sharding_key: user_id
      table_count: 8
    game_player:
      algorithm_type: string
      sharding_key: open_id
      table_count: 4
    relate_user:
      algorithm_type: string
      sharding_key: open_id
      table_count: 4
    friend_relations:
      algorithm_type: multi_string
      sharding_key: user_id,friend_id
      table_count: 4

# ========== 日志配置 ==========
logger:
  type: hybrid         # console / file / hybrid
  color: true
  level: info
  filePath: ./logs/app.log
  maxSize: 10
  maxBackups: 7
  maxAge: 30
  compress: true

